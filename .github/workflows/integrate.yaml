name: Wisp CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wisp-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Analysis and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: python -m pip install pillow==12.0.0 pyyaml==6.0.3 'reuse[charset-normalizer]==6.2.0'
      - name: Check workflow and branding contracts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check reproducible branding assets
        run: |
          python scripts/generate_wisp_branding.py
          git diff --exit-code -- assets/logo android/app/src/main/res ios/Runner/Assets.xcassets
      - name: Check copyright and license metadata
        run: reuse lint
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install native test build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang cmake ninja-build pkg-config libssl-dev libgtk-3-dev
      - name: Resolve pinned Dart dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter application
        run: flutter analyze --no-pub
      - name: Prepare native encryption test library
        run: |
          version="$(python -c 'import yaml; print(yaml.safe_load(open("pubspec.lock"))["packages"]["vodozemac"]["version"])')"
          git clone --depth 1 --branch "$version" https://github.com/famedly/dart-vodozemac.git "$RUNNER_TEMP/dart-vodozemac"
          cp -R "$RUNNER_TEMP/dart-vodozemac/rust" test/rust
          cargo build --manifest-path test/rust/Cargo.toml
      - name: Prepare screenshot fonts
        run: dart run golden_screenshot:download_apple_fonts
      - name: Run Flutter tests
        run: flutter test --no-pub --reporter expanded

  android:
    name: Android debug APK (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install Android compile SDK
        run: sdkmanager 'platforms;android-37'
      - name: Resolve pinned Dart dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Build debug APK without Firebase or release credentials
        run: flutter build apk --debug --target-platform android-arm64 --no-pub
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wisp-android-debug-arm64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator app (ARM64, unsigned)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          architecture: arm64
          cache: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Show Apple toolchain
        run: xcodebuild -version
      - name: Resolve pinned Dart dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Configure unsigned simulator build
        run: flutter build ios --simulator --debug --no-codesign --config-only --no-pub
      - name: Build ARM64 simulator app
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/wisp-derived-data" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          mkdir -p build/ci
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/wisp-derived-data/Build/Products/Debug-iphonesimulator/Runner.app" \
            build/ci/wisp-ios-simulator-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wisp-ios-simulator-arm64
          path: build/ci/wisp-ios-simulator-arm64.zip
          if-no-files-found: error
          retention-days: 7
